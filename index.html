<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rubikova kocka – simulácia</title>
  <style>
    :root {
      --panel-bg: rgba(20, 24, 34, 0.82);
      --accent: #4f8cff;
      --accent-2: #2fbf71;
      --text: #eef2f8;
      --muted: #9aa6b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 30%, #2a3450 0%, #0f1320 70%);
    }
    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 18px;
      width: 250px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    #panel h1 {
      font-size: 17px;
      margin: 0 0 4px;
      letter-spacing: 0.3px;
    }
    #panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .row label { font-size: 13px; color: var(--muted); }
    #moves {
      width: 64px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 14px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.05s ease, filter 0.15s ease, opacity 0.15s ease;
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #scramble { background: linear-gradient(180deg, #5a96ff, #3f74e0); }
    #solve    { background: linear-gradient(180deg, #36cd80, #25a863); }
    #reset    { background: linear-gradient(180deg, #5a657a, #424b5e); }
    button:not(:disabled):hover { filter: brightness(1.08); }

    #status {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--muted);
      min-height: 16px;
      line-height: 1.4;
    }
    #status b { color: var(--text); }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>

  <!-- three.js a OrbitControls z CDN (žiadne lokálne závislosti) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>

  <div id="panel">
    <h1>Rubikova kocka</h1>
    <div class="sub">3D simulácia · zamiešaj a vyrieš</div>

    <div class="row">
      <label for="moves">Počet ťahov X</label>
      <input id="moves" type="number" min="1" max="100" value="20" />
    </div>

    <button id="scramble">Zamiešať</button>
    <button id="solve" disabled>Vyriešiť</button>
    <button id="reset">Reset</button>

    <div id="status">Kocka je <b>postavená</b>.</div>
  </div>

  <div id="hint">Klikni bližšie k hrane kocky = pootoč daný slice · ťahaj myšou = otoč pohľad · koliesko = zoom</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ---------- Konštanty ----------
    const COLORS = {
      U: 0xf7f7f5, // hore – biela
      D: 0xffd62e, // dole – žltá
      F: 0x4cc23f, // vpredu – zelená
      B: 0x2f6fed, // vzadu – modrá
      R: 0xe8423a, // vpravo – červená
      L: 0xff8b1f, // vľavo – oranžová
    };
    const BODY = 0x0b0b0d;           // čierne plastové telo kocky
    const SIZE = 0.97;               // veľkosť cubie (telo)
    const BODY_RADIUS = 0.09;        // zaoblenie hrán tela
    const STICKER = 0.82;            // veľkosť nálepky
    const STICKER_RADIUS = 0.12;     // zaoblenie rohov nálepky
    const HALF_PI = Math.PI / 2;

    // Steny cubie: lokálna normála + podmienka, kedy je nálepka viditeľná.
    const FACE_DEFS = [
      { n: new THREE.Vector3( 1, 0, 0), key: 'R', test: (x) => x ===  1 },
      { n: new THREE.Vector3(-1, 0, 0), key: 'L', test: (x) => x === -1 },
      { n: new THREE.Vector3( 0, 1, 0), key: 'U', test: (_x, y) => y ===  1 },
      { n: new THREE.Vector3( 0,-1, 0), key: 'D', test: (_x, y) => y === -1 },
      { n: new THREE.Vector3( 0, 0, 1), key: 'F', test: (_x, _y, z) => z ===  1 },
      { n: new THREE.Vector3( 0, 0,-1), key: 'B', test: (_x, _y, z) => z === -1 },
    ];

    // Definícia základných ťahov: os, vrstva (±1) a smer otočenia.
    const MOVES = {
      U: { axis: 'y', layer:  1, dir: -1 },
      D: { axis: 'y', layer: -1, dir:  1 },
      R: { axis: 'x', layer:  1, dir: -1 },
      L: { axis: 'x', layer: -1, dir:  1 },
      F: { axis: 'z', layer:  1, dir: -1 },
      B: { axis: 'z', layer: -1, dir:  1 },
    };
    const FACES = ['U', 'D', 'L', 'R', 'F', 'B'];
    const SUFFIXES = ['', "'", '2'];

    // ====================================================================
    // Solver (layer-by-layer, beginner method, 2-look last layer).
    // Pure logic over a 54-facelet model whose slots and move permutations
    // are generated from geometry, matching the 3D rotation semantics above.
    // Reuses MOVES. The model's "solved" check is named `modelSolved` to
    // avoid clashing with the scene's `isSolved`.
    // ====================================================================
    const M_AXES = ['x', 'y', 'z'];
    const mv = (x, y, z) => ({ x, y, z });
    const keyOf = (p, n) => `${p.x},${p.y},${p.z}|${n.x},${n.y},${n.z}`;

    function rotate(p, axis, k) {
      let { x, y, z } = p;
      for (let i = 0; i < ((k % 4) + 4) % 4; i++) {
        if (axis === 'x') { const ny = -z, nz = y; y = ny; z = nz; }
        else if (axis === 'y') { const nx = z, nz = -x; x = nx; z = nz; }
        else { const nx = -y, ny = x; x = nx; y = ny; }
      }
      return mv(x, y, z);
    }

    const MODEL_FACES = [
      { face: 'U', nrm: mv(0, 1, 0) },
      { face: 'R', nrm: mv(1, 0, 0) },
      { face: 'F', nrm: mv(0, 0, 1) },
      { face: 'D', nrm: mv(0,-1, 0) },
      { face: 'L', nrm: mv(-1,0, 0) },
      { face: 'B', nrm: mv(0, 0,-1) },
    ];

    const FACELETS = [];
    for (const { face, nrm } of MODEL_FACES) {
      const fixedAxis = M_AXES.find((a) => Math.abs(nrm[a]) === 1);
      const plane = M_AXES.filter((a) => a !== fixedAxis);
      for (const a0 of [-1, 0, 1])
        for (const a1 of [-1, 0, 1]) {
          const p = mv(0, 0, 0);
          p[fixedAxis] = nrm[fixedAxis];
          p[plane[0]] = a0;
          p[plane[1]] = a1;
          FACELETS.push({ pos: p, nrm, face });
        }
    }

    const SLOT_INDEX = new Map();
    FACELETS.forEach((s, i) => SLOT_INDEX.set(keyOf(s.pos, s.nrm), i));

    function buildPerm(face) {
      const { axis, layer, dir } = MOVES[face];
      const perm = FACELETS.map((_, i) => i);
      FACELETS.forEach((s, i) => {
        if (s.pos[axis] !== layer) return;
        const np = rotate(s.pos, axis, dir);
        const nn = rotate(s.nrm, axis, dir);
        perm[SLOT_INDEX.get(keyOf(np, nn))] = i;
      });
      return perm;
    }
    const PERM = {};
    for (const f of Object.keys(MOVES)) PERM[f] = buildPerm(f);

    const SOLVED = FACELETS.map((s) => s.face);

    function turn(state, face) {
      const perm = PERM[face];
      return perm.map((i) => state[i]);
    }
    function applyToken(state, token) {
      const suffix = token.slice(1);
      let s = state;
      const reps = suffix === "'" ? 3 : suffix === '2' ? 2 : 1;
      for (let i = 0; i < reps; i++) s = turn(s, token[0]);
      return s;
    }
    function applyTokens(state, tokens) { return tokens.reduce(applyToken, state); }
    function modelSolved(state) { return state.every((c, i) => c === SOLVED[i]); }

    const V = {
      U: mv(0, 1, 0), D: mv(0, -1, 0),
      F: mv(0, 0, 1), B: mv(0, 0, -1),
      R: mv(1, 0, 0), L: mv(-1, 0, 0),
    };
    const SIDES = ['F', 'R', 'B', 'L'];
    const eqv = (a, b) => a.x === b.x && a.y === b.y && a.z === b.z;
    const addv = (a, b) => mv(a.x + b.x, a.y + b.y, a.z + b.z);

    function sideLetter(vec) {
      for (const k of Object.keys(V)) if (eqv(V[k], vec)) return k;
      return null;
    }
    const rightOf = (s) => sideLetter(rotate(V[s], 'y', 1));
    const leftOf = (s) => sideLetter(rotate(V[s], 'y', 3));
    const oppositeOf = (s) => sideLetter(rotate(V[s], 'y', 2));

    const EDGE_POS = [], CORNER_POS = [];
    for (const x of [-1, 0, 1]) for (const y of [-1, 0, 1]) for (const z of [-1, 0, 1]) {
      const nz = [x, y, z].filter((c) => c !== 0).length;
      if (nz === 2) EDGE_POS.push(mv(x, y, z));
      if (nz === 3) CORNER_POS.push(mv(x, y, z));
    }

    function stickerNrms(pos) {
      const out = [];
      for (const a of M_AXES) if (pos[a] !== 0) { const n = mv(0, 0, 0); n[a] = pos[a]; out.push(n); }
      return out;
    }
    function colorAt(state, pos, nrm) { return state[SLOT_INDEX.get(keyOf(pos, nrm))]; }

    function findEdge(state, c1, c2) {
      for (const pos of EDGE_POS) {
        const cols = stickerNrms(pos).map((n) => colorAt(state, pos, n));
        if (cols.includes(c1) && cols.includes(c2)) return pos;
      }
      return null;
    }
    function findCorner(state, c1, c2, c3) {
      const want = [c1, c2, c3].sort().join('');
      for (const pos of CORNER_POS) {
        const cols = stickerNrms(pos).map((n) => colorAt(state, pos, n)).sort().join('');
        if (cols === want) return pos;
      }
      return null;
    }

    function frame(front) {
      return {
        F: front, R: rightOf(front), B: oppositeOf(front), L: leftOf(front), U: 'U', D: 'D',
      };
    }
    function mapAlg(front, alg) {
      const fr = frame(front);
      return alg.trim().split(/\s+/).filter(Boolean).map((t) => fr[t[0]] + t.slice(1));
    }

    function makeCtx(state) {
      const ctx = { state: state.slice(), moves: [] };
      ctx.do = (seq) => {
        const tokens = Array.isArray(seq) ? seq : seq.trim().split(/\s+/).filter(Boolean);
        for (const t of tokens) { ctx.state = applyToken(ctx.state, t); ctx.moves.push(t); }
      };
      return ctx;
    }

    // Phase 1: D cross.
    function crossEdgeSolved(state, S) {
      const pos = addv(V.D, V[S]);
      return colorAt(state, pos, V.D) === 'D' && colorAt(state, pos, V[S]) === S;
    }
    function crossDone(state) { return SIDES.every((S) => crossEdgeSolved(state, S)); }

    function insertCrossEdge(ctx, S) {
      for (let k = 0; k < 4; k++) {
        const pos = findEdge(ctx.state, 'D', S);
        if (sideLetter(stickerNrms(pos).find((n) => n.y === 0)) === S) break;
        ctx.do('U');
      }
      const pos = findEdge(ctx.state, 'D', S);
      if (colorAt(ctx.state, pos, V.U) === 'D') ctx.do(S + '2');
      else ctx.do(mapAlg(S, "F D R' D'"));
    }

    const ALL_TOKENS = [];
    for (const f of Object.keys(MOVES)) for (const suf of ['', "'", '2']) ALL_TOKENS.push(f + suf);

    function searchSeq(state, ok, maxDepth) {
      let found = null;
      const dfs = (st, seq, d) => {
        if (found) return;
        if (ok(st)) { found = seq.slice(); return; }
        if (d === 0) return;
        for (const t of ALL_TOKENS) {
          if (seq.length && seq[seq.length - 1][0] === t[0]) continue;
          dfs(applyToken(st, t), [...seq, t], d - 1);
          if (found) return;
        }
      };
      for (let depth = 1; depth <= maxDepth && !found; depth++) dfs(state, [], depth);
      return found;
    }

    function liftEdgeToTop(ctx, S) {
      const placed = SIDES.filter((s) => s !== S && crossEdgeSolved(ctx.state, s));
      const ok = (st) => findEdge(st, 'D', S).y === 1 && placed.every((s) => crossEdgeSolved(st, s));
      const seq = searchSeq(ctx.state, ok, 3);
      if (seq) ctx.do(seq);
    }

    function phaseDCross(ctx) {
      for (let g = 0; g < 50 && !crossDone(ctx.state); g++) {
        const S = SIDES.find((s) => !crossEdgeSolved(ctx.state, s));
        if (findEdge(ctx.state, 'D', S).y === 1) insertCrossEdge(ctx, S);
        else liftEdgeToTop(ctx, S);
      }
    }

    // Phase 2: D corners.
    const D_CORNERS = [['F', 'R'], ['R', 'B'], ['B', 'L'], ['L', 'F']];
    function cornerColPos(y, a, b) { return mv(V[a].x + V[b].x, y, V[a].z + V[b].z); }
    function dCornerSolved(state, a, b) {
      const p = cornerColPos(-1, a, b);
      return colorAt(state, p, V.D) === 'D' && colorAt(state, p, V[a]) === a && colorAt(state, p, V[b]) === b;
    }
    function cornerColumnFront(pos) {
      for (const a of SIDES) {
        const b = rightOf(a);
        if (V[a].x + V[b].x === pos.x && V[a].z + V[b].z === pos.z) return a;
      }
      return null;
    }
    function placeDCorner(ctx, a, b) {
      for (let g = 0; g < 12; g++) {
        if (dCornerSolved(ctx.state, a, b)) return;
        const c = findCorner(ctx.state, 'D', a, b);
        if (c.y === -1) { ctx.do(mapAlg(cornerColumnFront(c), "R U R'")); continue; }
        let cur = findCorner(ctx.state, 'D', a, b);
        for (let k = 0; k < 4 && !(cur.x === V[a].x + V[b].x && cur.z === V[a].z + V[b].z); k++) {
          ctx.do('U');
          cur = findCorner(ctx.state, 'D', a, b);
        }
        const top = cornerColPos(1, a, b);
        if (colorAt(ctx.state, top, V.U) === 'D') ctx.do(mapAlg(a, "R F R2 F' R'"));
        else if (colorAt(ctx.state, top, V[a]) === 'D') ctx.do(mapAlg(a, "F' U' F"));
        else ctx.do(mapAlg(a, "R U R'"));
      }
    }
    function phaseDCorners(ctx) {
      for (let g = 0; g < 50 && !D_CORNERS.every(([a, b]) => dCornerSolved(ctx.state, a, b)); g++)
        for (const [a, b] of D_CORNERS) if (!dCornerSolved(ctx.state, a, b)) placeDCorner(ctx, a, b);
    }

    // Phase 3: middle layer.
    const E_EDGES = [['F', 'R'], ['R', 'B'], ['B', 'L'], ['L', 'F']];
    function middleEdgeSolved(state, a, b) {
      const p = mv(V[a].x + V[b].x, 0, V[a].z + V[b].z);
      return colorAt(state, p, V[a]) === a && colorAt(state, p, V[b]) === b;
    }
    function placeMiddleEdge(ctx, a, b) {
      for (let g = 0; g < 12; g++) {
        if (middleEdgeSolved(ctx.state, a, b)) return;
        let pos = findEdge(ctx.state, a, b);
        if (pos.y === 0) { ctx.do(mapAlg(cornerColumnFront(pos), "R' U2 B' R B U2 R")); continue; }
        for (let k = 0; k < 4; k++) {
          pos = findEdge(ctx.state, a, b);
          const horiz = stickerNrms(pos).find((n) => n.y === 0);
          if (colorAt(ctx.state, pos, horiz) === sideLetter(horiz)) break;
          ctx.do('U');
        }
        pos = findEdge(ctx.state, a, b);
        const front = sideLetter(stickerNrms(pos).find((n) => n.y === 0));
        const topColor = colorAt(ctx.state, pos, V.U);
        if (topColor === rightOf(front)) ctx.do(mapAlg(front, "R' U2 B' R B U2 R"));
        else ctx.do(mapAlg(front, "R' F2 U' F' U F2 R"));
      }
    }
    function phaseMiddle(ctx) {
      for (let g = 0; g < 30 && !E_EDGES.every(([a, b]) => middleEdgeSolved(ctx.state, a, b)); g++)
        for (const [a, b] of E_EDGES) if (!middleEdgeSolved(ctx.state, a, b)) placeMiddleEdge(ctx, a, b);
    }

    // Phase 4: U cross (orient last-layer edges).
    function uCrossDone(state) { return SIDES.every((S) => colorAt(state, addv(V.U, V[S]), V.U) === 'U'); }
    function phaseUCross(ctx) {
      for (let g = 0; g < 8 && !uCrossDone(ctx.state); g++) {
        const oriented = SIDES.filter((S) => colorAt(ctx.state, addv(V.U, V[S]), V.U) === 'U');
        if (oriented.length === 2) {
          const [o1, o2] = oriented;
          if (eqv(addv(V[o1], V[o2]), mv(0, 0, 0))) {
            const front = (oriented.includes('R') && oriented.includes('L')) ? 'F' : 'R';
            ctx.do(mapAlg(front, "F R U R' U' F'"));
          } else {
            const front = SIDES.find((f) => {
              const set = new Set([leftOf(f), oppositeOf(f)]);
              return set.has(o1) && set.has(o2);
            });
            ctx.do(mapAlg(front, "F R U R' U' F'"));
          }
        } else {
          ctx.do(mapAlg('F', "F R U R' U' F'"));
        }
      }
    }

    // Phase 5: orient U corners (repeated trigger from a fixed spot).
    function phaseUCorners(ctx) {
      const frt = mv(1, 1, 1);
      for (let i = 0; i < 4; i++) {
        for (let r = 0; r < 6 && colorAt(ctx.state, frt, V.U) !== 'U'; r++) ctx.do("R' D' R D");
        ctx.do('U');
      }
    }

    // Phase 6: permute last layer.
    function cornerPlaced(state, pos) {
      return stickerNrms(pos).filter((n) => n.y === 0).every((n) => colorAt(state, pos, n) === sideLetter(n));
    }
    function edgePlaced(state, S) { return colorAt(state, addv(V.U, V[S]), V[S]) === S; }
    function uEdgesPermuted(state) { return SIDES.every((S) => edgePlaced(state, S)); }

    function homeCornersAfterAUF(state, k) {
      let s = state;
      for (let j = 0; j < k; j++) s = applyToken(s, 'U');
      return CORNER_POS.filter((p) => p.y === 1 && cornerPlaced(s, p)).length;
    }
    function bestAUFHome(state) {
      let best = 0;
      for (let k = 0; k < 4; k++) best = Math.max(best, homeCornersAfterAUF(state, k));
      return best;
    }
    const TOP_CORNERS = CORNER_POS.filter((p) => p.y === 1);
    function cornerHomeSlot(state, pos) {
      const cols = stickerNrms(pos).filter((n) => n.y === 0).map((n) => colorAt(state, pos, n));
      return TOP_CORNERS.findIndex((q) =>
        stickerNrms(q).filter((n) => n.y === 0).every((n) => cols.includes(sideLetter(n))));
    }
    function cornerParity(state) {
      const perm = TOP_CORNERS.map((p) => cornerHomeSlot(state, p));
      let inv = 0;
      for (let i = 0; i < perm.length; i++)
        for (let j = i + 1; j < perm.length; j++) if (perm[i] > perm[j]) inv++;
      return inv & 1;
    }
    const A_PERM = "R' F R' B2 R F' R' B2 R2";
    function permuteUCorners(ctx) {
      if (cornerParity(ctx.state)) ctx.do('U');
      for (let g = 0; g < 30; g++) {
        let k4 = -1;
        for (let k = 0; k < 4; k++) if (homeCornersAfterAUF(ctx.state, k) === 4) { k4 = k; break; }
        if (k4 >= 0) { for (let j = 0; j < k4; j++) ctx.do('U'); return; }
        let best = 'F', bestScore = -1;
        for (const front of SIDES) {
          const score = bestAUFHome(applyTokens(ctx.state, mapAlg(front, A_PERM)));
          if (score > bestScore) { bestScore = score; best = front; }
        }
        ctx.do(mapAlg(best, A_PERM));
      }
    }
    function permuteUEdges(ctx) {
      for (let g = 0; g < 8 && !uEdgesPermuted(ctx.state); g++) {
        const homeS = SIDES.find((S) => edgePlaced(ctx.state, S));
        const front = homeS ? oppositeOf(homeS) : 'F';
        ctx.do(mapAlg(front, "R U' R U R U R U' R' U' R2"));
      }
    }
    function phasePLL(ctx) {
      permuteUCorners(ctx);
      permuteUEdges(ctx);
      for (let k = 0; k < 4 && !modelSolved(ctx.state); k++) ctx.do('U');
    }

    function turnCount(token) {
      const s = token.slice(1);
      return s === "'" ? 3 : s === '2' ? 2 : 1;
    }
    function tokenFromTurns(face, n) {
      n = ((n % 4) + 4) % 4;
      if (n === 0) return null;
      return n === 1 ? face : n === 2 ? face + '2' : face + "'";
    }
    function simplify(tokens) {
      let out = tokens.slice();
      let changed = true;
      while (changed) {
        changed = false;
        for (let i = 0; i + 1 < out.length; i++) {
          if (out[i][0] === out[i + 1][0]) {
            const merged = tokenFromTurns(out[i][0], turnCount(out[i]) + turnCount(out[i + 1]));
            out.splice(i, 2, ...(merged ? [merged] : []));
            changed = true;
            break;
          }
        }
      }
      return out;
    }

    // From any legal facelet state, return a list of move tokens that solve it.
    function solve(state) {
      const ctx = makeCtx(state);
      phaseDCross(ctx);
      phaseDCorners(ctx);
      phaseMiddle(ctx);
      phaseUCross(ctx);
      phaseUCorners(ctx);
      phasePLL(ctx);
      const moves = simplify(ctx.moves);
      if (!modelSolved(applyTokens(state, moves)))
        throw new Error('solver produced an invalid solution');
      return moves;
    }

    // ---------- Scéna ----------
    const sceneEl = document.getElementById('scene');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.5, 4.5, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    sceneEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 16;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const key = new THREE.DirectionalLight(0xffffff, 0.65);
    key.position.set(6, 9, 7);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-7, -3, -6);
    scene.add(fill);

    // ---------- Stavba kocky ----------
    let cubies = [];
    const bodyGeo = new RoundedBoxGeometry(SIZE, SIZE, SIZE, 4, BODY_RADIUS);

    // Zaoblený obdĺžnik (nálepka) v rovine XY, vystredený v počiatku.
    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }
    const stickerGeo = new THREE.ShapeGeometry(roundedRectShape(STICKER, STICKER, STICKER_RADIUS));
    const Z_AXIS = new THREE.Vector3(0, 0, 1);

    function makeCubie(x, y, z) {
      const body = new THREE.Mesh(
        bodyGeo,
        new THREE.MeshStandardMaterial({ color: BODY, roughness: 0.35, metalness: 0.0 })
      );
      body.position.set(x, y, z);
      body.userData.stickers = [];

      for (const f of FACE_DEFS) {
        if (!f.test(x, y, z)) continue;
        const mat = new THREE.MeshStandardMaterial({ color: COLORS[f.key], roughness: 0.4, metalness: 0.0 });
        const sticker = new THREE.Mesh(stickerGeo, mat);
        sticker.quaternion.setFromUnitVectors(Z_AXIS, f.n);
        sticker.position.copy(f.n).multiplyScalar(SIZE / 2 + 0.002);
        body.add(sticker);
        body.userData.stickers.push({ normal: f.n.clone(), color: COLORS[f.key] });
      }
      return body;
    }

    function disposeCubie(c) {
      scene.remove(c);
      c.material.dispose();
      c.children.forEach((s) => s.material.dispose());
    }

    function buildCube() {
      cubies.forEach(disposeCubie);
      cubies = [];
      for (let x = -1; x <= 1; x++)
        for (let y = -1; y <= 1; y++)
          for (let z = -1; z <= 1; z++) {
            const c = makeCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
          }
    }

    // ---------- Ťahy ----------
    // token -> { axis, layer, angle, turns }
    function parseToken(token) {
      const face = token[0];
      const suffix = token.slice(1);
      const base = MOVES[face];
      const turns = suffix === '2' ? 2 : 1;
      const sign = suffix === "'" ? -1 : 1;
      return {
        axis: base.axis,
        layer: base.layer,
        angle: base.dir * sign * HALF_PI * turns,
        turns,
      };
    }

    // ---------- Animácia + fronta ----------
    const queue = [];
    let activeMove = null;
    let isBusy = false;
    let onDone = null;
    const clock = new THREE.Clock();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function startMove(m) {
      const pivot = new THREE.Group();
      scene.add(pivot);
      cubies.forEach((c) => {
        if (Math.round(c.position[m.axis]) === m.layer) pivot.attach(c);
      });
      activeMove = {
        pivot,
        axis: m.axis,
        target: m.angle,
        elapsed: 0,
        duration: m.turns === 2 ? 0.42 : 0.26,
      };
    }

    function finishMove() {
      const { pivot, axis, target } = activeMove;
      pivot.rotation[axis] = target;
      pivot.updateMatrixWorld(true);
      [...pivot.children].forEach((c) => {
        scene.attach(c);
        // zaokrúhli pozíciu -> zabráni numerickému driftu
        c.position.set(
          Math.round(c.position.x),
          Math.round(c.position.y),
          Math.round(c.position.z)
        );
      });
      scene.remove(pivot);
      activeMove = null;
    }

    // Zaradí ťahy (move-objekty) do fronty.
    function enqueueMoves(moves, phase, doneCb) {
      isBusy = true;
      currentPhase = phase;
      onDone = doneCb || null;
      queue.push(...moves);
      updateButtons();
    }

    // Pohodlný vstup cez notáciu ("U", "R'", "F2", …).
    function enqueue(tokens, phase, doneCb) {
      enqueueMoves(tokens.map(parseToken), phase, doneCb);
    }

    // ---------- Miešanie a solver ----------
    let currentPhase = null;

    function generateScramble(n) {
      const seq = [];
      let prev = null;
      for (let i = 0; i < n; i++) {
        let f;
        do { f = FACES[Math.floor(Math.random() * FACES.length)]; } while (f === prev);
        prev = f;
        const suffix = SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
        seq.push(f + suffix);
      }
      return seq;
    }

    // ---------- Kontrola vyriešenia ----------
    // Kocka je vyriešená, keď každá zo 6 svetových strán ukazuje jednu farbu.
    function isSolved() {
      const dirs = [
        new THREE.Vector3( 1, 0, 0), new THREE.Vector3(-1, 0, 0),
        new THREE.Vector3( 0, 1, 0), new THREE.Vector3( 0,-1, 0),
        new THREE.Vector3( 0, 0, 1), new THREE.Vector3( 0, 0,-1),
      ];
      for (const dir of dirs) {
        let color = null;
        for (const c of cubies) {
          for (const s of c.userData.stickers) {
            const wn = s.normal.clone().applyQuaternion(c.quaternion);
            if (wn.dot(dir) > 0.9) {
              if (color === null) color = s.color;
              else if (color !== s.color) return false;
            }
          }
        }
      }
      return true;
    }

    // Z 3D scény poskladá facelet pole pre solver, s rovnakými slotmi (pos,nrm)
    // ako model, takže mapovanie je automaticky zarovnané.
    const COLOR_TO_FACE = Object.fromEntries(Object.entries(COLORS).map(([f, c]) => [c, f]));
    function readState() {
      const state = new Array(54);
      const at = new Map();
      cubies.forEach((c) => {
        const p = `${Math.round(c.position.x)},${Math.round(c.position.y)},${Math.round(c.position.z)}`;
        at.set(p, c);
      });
      FACELETS.forEach((slot, i) => {
        const c = at.get(`${slot.pos.x},${slot.pos.y},${slot.pos.z}`);
        const want = new THREE.Vector3(slot.nrm.x, slot.nrm.y, slot.nrm.z);
        for (const s of c.userData.stickers) {
          const wn = s.normal.clone().applyQuaternion(c.quaternion);
          if (wn.dot(want) > 0.9) { state[i] = COLOR_TO_FACE[s.color]; break; }
        }
      });
      return state;
    }

    // ---------- UI ----------
    const movesInput = document.getElementById('moves');
    const btnScramble = document.getElementById('scramble');
    const btnSolve = document.getElementById('solve');
    const btnReset = document.getElementById('reset');
    const statusEl = document.getElementById('status');

    function setStatus(html) { statusEl.innerHTML = html; }

    function updateButtons() {
      btnScramble.disabled = isBusy;
      btnReset.disabled = isBusy;
      btnSolve.disabled = isBusy || isSolved();
    }

    btnScramble.addEventListener('click', () => {
      if (isBusy) return;
      let n = parseInt(movesInput.value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > 100) n = 100;
      movesInput.value = n;
      const seq = generateScramble(n);
      setStatus(`Miešam… <b>${n}</b> ťahov`);
      enqueue(seq, 'scramble', () => {
        setStatus(`Zamiešané <b>${seq.length}</b> ťahmi.<br>Stlač <b>Vyriešiť</b>.`);
      });
    });

    btnSolve.addEventListener('click', () => {
      if (isBusy || isSolved()) return;
      const solution = solve(readState());
      if (solution.length === 0) { setStatus('Kocka je už <b>vyriešená</b> ✓'); return; }
      setStatus(`Riešim… <b>${solution.length}</b> ťahov`);
      enqueue(solution, 'solve', () => {
        setStatus(isSolved() ? 'Kocka je <b>vyriešená</b> ✓' : 'Hotovo.');
        updateButtons();
      });
    });

    btnReset.addEventListener('click', () => {
      if (isBusy) return;
      queue.length = 0;
      buildCube();
      setStatus('Kocka je <b>postavená</b>.');
      updateButtons();
    });

    // ---------- Render loop ----------
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (activeMove) {
        activeMove.elapsed += dt;
        const t = Math.min(1, activeMove.elapsed / activeMove.duration);
        activeMove.pivot.rotation[activeMove.axis] = activeMove.target * easeInOut(t);
        if (t >= 1) finishMove();
      } else if (queue.length > 0) {
        startMove(queue.shift());
      } else if (isBusy) {
        isBusy = false;
        updateButtons();
        const cb = onDone; onDone = null;
        if (cb) cb();
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Ovládanie myšou (klik na stenu pootočí vrstvu) ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let drag = null; // { cubie, normal, point, x, y }

    // Smer otáčania: +1 / -1 (ľahké prehodenie, keby bol smer opačný).
    const TURN_SIGN = 1;

    function setPointer(clientX, clientY) {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((clientY - r.top) / r.height) * 2 + 1;
    }

    // Z miesta kliknutia v rámci malej kocky odvodí, ktorú vrstvu a ktorým
    // smerom otočiť. Podľa toho, či je klik bližšie k vodorovnej alebo zvislej
    // hrane steny, sa otočí horizontálny alebo vertikálny „slice“.
    function computeMove(cubie, normal, point) {
      // poloha kliknutia v rovine steny (vzhľadom na stred malej kocky)
      const offset = point.clone().sub(cubie.position);
      offset.addScaledVector(normal, -offset.dot(normal));

      const nAxis = Math.abs(normal.x) > 0.5 ? 'x' : Math.abs(normal.y) > 0.5 ? 'y' : 'z';
      // dominantná dotyková os (mimo normály) určuje smer pohybu kliknutého bodu
      let tAxis = null, bestVal = -1;
      for (const a of ['x', 'y', 'z']) {
        if (a === nAxis) continue;
        if (Math.abs(offset[a]) > bestVal) { bestVal = Math.abs(offset[a]); tAxis = a; }
      }
      if (!tAxis) return null;

      const moveDir = new THREE.Vector3();
      moveDir[tAxis] = Math.sign(offset[tAxis]) || 1;

      // os otáčania = normála × smer pohybu  (kolmá na obe → tretia os)
      const rotAxis = new THREE.Vector3().crossVectors(normal, moveDir).round();
      let axisName, axSign;
      for (const a of ['x', 'y', 'z']) {
        if (Math.abs(rotAxis[a]) > 0.5) { axisName = a; axSign = Math.sign(rotAxis[a]); }
      }
      if (!axisName) return null;

      // znamienko tak, aby sa kliknutý bod pohol v smere moveDir
      const vel = new THREE.Vector3().crossVectors(rotAxis, cubie.position);
      const sgn = Math.sign(vel.dot(moveDir)) || 1;

      return {
        axis: axisName,
        layer: Math.round(cubie.position[axisName]),
        angle: TURN_SIGN * axSign * sgn * HALF_PI,
        turns: 1,
      };
    }

    // Klik na stenu kocky pootočí danú vrstvu – stačí kliknúť, netreba ťahať.
    // Ťahaním (pohybom myši) sa otáča pohľad kamery (OrbitControls).
    window.addEventListener('pointerdown', (e) => {
      if (isBusy || e.target !== renderer.domElement) { drag = null; return; }
      setPointer(e.clientX, e.clientY);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(cubies, false);
      if (hits.length === 0) { drag = null; return; } // prázdny priestor
      const hit = hits[0];
      // svetová normála steny, „prichytená“ na dominantnú os (kvôli zaobleným hranám)
      const wn = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const ax = Math.abs(wn.x), ay = Math.abs(wn.y), az = Math.abs(wn.z);
      let normal;
      if (ax >= ay && ax >= az) normal = new THREE.Vector3(Math.sign(wn.x), 0, 0);
      else if (ay >= az) normal = new THREE.Vector3(0, Math.sign(wn.y), 0);
      else normal = new THREE.Vector3(0, 0, Math.sign(wn.z));
      drag = { cubie: hit.object, normal, point: hit.point.clone(), x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
      if (moved < 8) {
        // čistý klik -> otoč vrstvu podľa miesta kliknutia v rámci malej kocky
        const move = computeMove(drag.cubie, drag.normal, drag.point);
        if (move) enqueueMoves([move], 'manual');
      }
      drag = null; // inak to bol ťah -> kameru už otočil OrbitControls
    });

    // Sprístupni pre ladenie z konzoly (kroky plánu 3 a 6).
    window.rubik = {
      applyMove: (t) => enqueue([t], 'manual'),
      isSolved,
      get cubies() { return cubies; },
    };

    // ---------- Štart ----------
    buildCube();
    updateButtons();
    animate();
  </script>
</body>
</html>
