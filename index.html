<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rubikova kocka – simulácia</title>
  <style>
    :root {
      --panel-bg: rgba(20, 24, 34, 0.82);
      --accent: #4f8cff;
      --accent-2: #2fbf71;
      --text: #eef2f8;
      --muted: #9aa6b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 30%, #2a3450 0%, #0f1320 70%);
    }
    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 18px;
      width: 250px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    #panel h1 {
      font-size: 17px;
      margin: 0 0 4px;
      letter-spacing: 0.3px;
    }
    #panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .row label { font-size: 13px; color: var(--muted); }
    #moves {
      width: 64px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 14px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.05s ease, filter 0.15s ease, opacity 0.15s ease;
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #scramble { background: linear-gradient(180deg, #5a96ff, #3f74e0); }
    #solve    { background: linear-gradient(180deg, #36cd80, #25a863); }
    #reset    { background: linear-gradient(180deg, #5a657a, #424b5e); }
    button:not(:disabled):hover { filter: brightness(1.08); }

    #status {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--muted);
      min-height: 16px;
      line-height: 1.4;
    }
    #status b { color: var(--text); }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>

  <!-- three.js a OrbitControls z CDN (žiadne lokálne závislosti) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>

  <div id="panel">
    <h1>Rubikova kocka</h1>
    <div class="sub">3D simulácia · zamiešaj a vyrieš</div>

    <div class="row">
      <label for="moves">Počet ťahov X</label>
      <input id="moves" type="number" min="1" max="100" value="20" />
    </div>

    <button id="scramble">Zamiešať</button>
    <button id="solve" disabled>Vyriešiť</button>
    <button id="reset">Reset</button>

    <div id="status">Kocka je <b>postavená</b>.</div>
  </div>

  <div id="hint">Klikni na stenu = pootoč vrstvu (od kurzora) · ťahaj myšou = otoč pohľad · koliesko = zoom</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ---------- Konštanty ----------
    const COLORS = {
      U: 0xf7f7f5, // hore – biela
      D: 0xffd62e, // dole – žltá
      F: 0x4cc23f, // vpredu – zelená
      B: 0x2f6fed, // vzadu – modrá
      R: 0xe8423a, // vpravo – červená
      L: 0xff8b1f, // vľavo – oranžová
    };
    const BODY = 0x0b0b0d;           // čierne plastové telo kocky
    const SIZE = 0.97;               // veľkosť cubie (telo)
    const BODY_RADIUS = 0.09;        // zaoblenie hrán tela
    const STICKER = 0.82;            // veľkosť nálepky
    const STICKER_RADIUS = 0.12;     // zaoblenie rohov nálepky
    const HALF_PI = Math.PI / 2;

    // Steny cubie: lokálna normála + podmienka, kedy je nálepka viditeľná.
    const FACE_DEFS = [
      { n: new THREE.Vector3( 1, 0, 0), key: 'R', test: (x) => x ===  1 },
      { n: new THREE.Vector3(-1, 0, 0), key: 'L', test: (x) => x === -1 },
      { n: new THREE.Vector3( 0, 1, 0), key: 'U', test: (_x, y) => y ===  1 },
      { n: new THREE.Vector3( 0,-1, 0), key: 'D', test: (_x, y) => y === -1 },
      { n: new THREE.Vector3( 0, 0, 1), key: 'F', test: (_x, _y, z) => z ===  1 },
      { n: new THREE.Vector3( 0, 0,-1), key: 'B', test: (_x, _y, z) => z === -1 },
    ];

    // Definícia základných ťahov: os, vrstva (±1) a smer otočenia.
    const MOVES = {
      U: { axis: 'y', layer:  1, dir: -1 },
      D: { axis: 'y', layer: -1, dir:  1 },
      R: { axis: 'x', layer:  1, dir: -1 },
      L: { axis: 'x', layer: -1, dir:  1 },
      F: { axis: 'z', layer:  1, dir: -1 },
      B: { axis: 'z', layer: -1, dir:  1 },
    };
    const FACES = ['U', 'D', 'L', 'R', 'F', 'B'];
    const SUFFIXES = ['', "'", '2'];

    // ---------- Scéna ----------
    const sceneEl = document.getElementById('scene');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.5, 4.5, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    sceneEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 16;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const key = new THREE.DirectionalLight(0xffffff, 0.65);
    key.position.set(6, 9, 7);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-7, -3, -6);
    scene.add(fill);

    // ---------- Stavba kocky ----------
    let cubies = [];
    const bodyGeo = new RoundedBoxGeometry(SIZE, SIZE, SIZE, 4, BODY_RADIUS);

    // Zaoblený obdĺžnik (nálepka) v rovine XY, vystredený v počiatku.
    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }
    const stickerGeo = new THREE.ShapeGeometry(roundedRectShape(STICKER, STICKER, STICKER_RADIUS));
    const Z_AXIS = new THREE.Vector3(0, 0, 1);

    function makeCubie(x, y, z) {
      const body = new THREE.Mesh(
        bodyGeo,
        new THREE.MeshStandardMaterial({ color: BODY, roughness: 0.35, metalness: 0.0 })
      );
      body.position.set(x, y, z);
      body.userData.stickers = [];

      for (const f of FACE_DEFS) {
        if (!f.test(x, y, z)) continue;
        const mat = new THREE.MeshStandardMaterial({ color: COLORS[f.key], roughness: 0.4, metalness: 0.0 });
        const sticker = new THREE.Mesh(stickerGeo, mat);
        sticker.quaternion.setFromUnitVectors(Z_AXIS, f.n);
        sticker.position.copy(f.n).multiplyScalar(SIZE / 2 + 0.002);
        body.add(sticker);
        body.userData.stickers.push({ normal: f.n.clone(), color: COLORS[f.key] });
      }
      return body;
    }

    function disposeCubie(c) {
      scene.remove(c);
      c.material.dispose();
      c.children.forEach((s) => s.material.dispose());
    }

    function buildCube() {
      cubies.forEach(disposeCubie);
      cubies = [];
      for (let x = -1; x <= 1; x++)
        for (let y = -1; y <= 1; y++)
          for (let z = -1; z <= 1; z++) {
            const c = makeCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
          }
    }

    // ---------- Ťahy ----------
    // token -> { axis, layer, angle, turns }
    function parseToken(token) {
      const face = token[0];
      const suffix = token.slice(1);
      const base = MOVES[face];
      const turns = suffix === '2' ? 2 : 1;
      const sign = suffix === "'" ? -1 : 1;
      return {
        axis: base.axis,
        layer: base.layer,
        angle: base.dir * sign * HALF_PI * turns,
        turns,
      };
    }

    function invertToken(token) {
      const face = token[0];
      const suffix = token.slice(1);
      if (suffix === '2') return token;        // dvojitý ťah je sám sebe inverzný
      if (suffix === "'") return face;          // U' -> U
      return face + "'";                        // U  -> U'
    }

    // ---------- Animácia + fronta ----------
    const queue = [];
    let activeMove = null;
    let isBusy = false;
    let onDone = null;
    const clock = new THREE.Clock();

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function startMove(m) {
      const pivot = new THREE.Group();
      scene.add(pivot);
      cubies.forEach((c) => {
        if (Math.round(c.position[m.axis]) === m.layer) pivot.attach(c);
      });
      activeMove = {
        pivot,
        axis: m.axis,
        target: m.angle,
        elapsed: 0,
        duration: m.turns === 2 ? 0.42 : 0.26,
      };
    }

    function finishMove() {
      const { pivot, axis, target } = activeMove;
      pivot.rotation[axis] = target;
      pivot.updateMatrixWorld(true);
      [...pivot.children].forEach((c) => {
        scene.attach(c);
        // zaokrúhli pozíciu -> zabráni numerickému driftu
        c.position.set(
          Math.round(c.position.x),
          Math.round(c.position.y),
          Math.round(c.position.z)
        );
      });
      scene.remove(pivot);
      activeMove = null;
    }

    // Zaradí ťahy (move-objekty) do fronty.
    function enqueueMoves(moves, phase, doneCb) {
      isBusy = true;
      currentPhase = phase;
      onDone = doneCb || null;
      queue.push(...moves);
      updateButtons();
    }

    // Pohodlný vstup cez notáciu ("U", "R'", "F2", …).
    function enqueue(tokens, phase, doneCb) {
      enqueueMoves(tokens.map(parseToken), phase, doneCb);
    }

    // ---------- Miešanie a solver ----------
    let scrambleSeq = [];
    let currentPhase = null;

    function generateScramble(n) {
      const seq = [];
      let prev = null;
      for (let i = 0; i < n; i++) {
        let f;
        do { f = FACES[Math.floor(Math.random() * FACES.length)]; } while (f === prev);
        prev = f;
        const suffix = SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
        seq.push(f + suffix);
      }
      return seq;
    }

    // Solver: spätné prehranie zamiešania (obrátené poradie + invertované ťahy).
    function solveSequence(scramble) {
      return [...scramble].reverse().map(invertToken);
    }

    // ---------- Kontrola vyriešenia ----------
    // Kocka je vyriešená, keď každá zo 6 svetových strán ukazuje jednu farbu.
    function isSolved() {
      const dirs = [
        new THREE.Vector3( 1, 0, 0), new THREE.Vector3(-1, 0, 0),
        new THREE.Vector3( 0, 1, 0), new THREE.Vector3( 0,-1, 0),
        new THREE.Vector3( 0, 0, 1), new THREE.Vector3( 0, 0,-1),
      ];
      for (const dir of dirs) {
        let color = null;
        for (const c of cubies) {
          for (const s of c.userData.stickers) {
            const wn = s.normal.clone().applyQuaternion(c.quaternion);
            if (wn.dot(dir) > 0.9) {
              if (color === null) color = s.color;
              else if (color !== s.color) return false;
            }
          }
        }
      }
      return true;
    }

    // ---------- UI ----------
    const movesInput = document.getElementById('moves');
    const btnScramble = document.getElementById('scramble');
    const btnSolve = document.getElementById('solve');
    const btnReset = document.getElementById('reset');
    const statusEl = document.getElementById('status');

    function setStatus(html) { statusEl.innerHTML = html; }

    function updateButtons() {
      btnScramble.disabled = isBusy;
      btnReset.disabled = isBusy;
      btnSolve.disabled = isBusy || scrambleSeq.length === 0;
    }

    btnScramble.addEventListener('click', () => {
      if (isBusy) return;
      let n = parseInt(movesInput.value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > 100) n = 100;
      movesInput.value = n;
      scrambleSeq = generateScramble(n);
      setStatus(`Miešam… <b>${n}</b> ťahov`);
      enqueue(scrambleSeq, 'scramble', () => {
        setStatus(`Zamiešané <b>${scrambleSeq.length}</b> ťahmi.<br>Stlač <b>Vyriešiť</b>.`);
      });
    });

    btnSolve.addEventListener('click', () => {
      if (isBusy || scrambleSeq.length === 0) return;
      const solution = solveSequence(scrambleSeq);
      setStatus(`Riešim… <b>${solution.length}</b> ťahov`);
      enqueue(solution, 'solve', () => {
        scrambleSeq = [];
        setStatus(isSolved() ? 'Kocka je <b>vyriešená</b> ✓' : 'Hotovo.');
        updateButtons();
      });
    });

    btnReset.addEventListener('click', () => {
      if (isBusy) return;
      queue.length = 0;
      buildCube();
      scrambleSeq = [];
      setStatus('Kocka je <b>postavená</b>.');
      updateButtons();
    });

    // ---------- Render loop ----------
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (activeMove) {
        activeMove.elapsed += dt;
        const t = Math.min(1, activeMove.elapsed / activeMove.duration);
        activeMove.pivot.rotation[activeMove.axis] = activeMove.target * easeInOut(t);
        if (t >= 1) finishMove();
      } else if (queue.length > 0) {
        startMove(queue.shift());
      } else if (isBusy) {
        isBusy = false;
        updateButtons();
        const cb = onDone; onDone = null;
        if (cb) cb();
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Ovládanie myšou (ťah na hranu pootočí vrstvu) ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let drag = null; // { cubie, normal, x, y, done }

    function setPointer(clientX, clientY) {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((clientY - r.top) / r.height) * 2 + 1;
    }

    // Svetový bod -> obrazovkové súradnice v px (y smerom dole).
    function toScreen(p) {
      const v = p.clone().project(camera);
      const w = renderer.domElement.clientWidth;
      const h = renderer.domElement.clientHeight;
      return new THREE.Vector2((v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h);
    }

    // Z ťahu myši odvodí, ktorú vrstvu a ktorým smerom otočiť.
    function computeMove(cubie, normal, dx, dy) {
      const dragScreen = new THREE.Vector2(dx, dy).normalize();
      const center = cubie.position.clone();
      // kandidátske osi roviny steny (tie, ktoré nie sú pozdĺž normály)
      const axisNames = ['x', 'y', 'z'].filter((a) => Math.abs(normal[a]) < 0.5);

      let best = null;
      let bestDot = 0;
      for (const a of axisNames) {
        const v = new THREE.Vector3(a === 'x' ? 1 : 0, a === 'y' ? 1 : 0, a === 'z' ? 1 : 0);
        const sa = toScreen(center);
        const sb = toScreen(center.clone().add(v));
        const sdir = sb.sub(sa);
        const d = sdir.x * dragScreen.x + sdir.y * dragScreen.y;
        if (Math.abs(d) > Math.abs(bestDot)) { bestDot = d; best = v; }
      }
      if (!best) return null;

      const moveDir = best.multiplyScalar(Math.sign(bestDot)); // svetový smer ťahu
      const ax = new THREE.Vector3().crossVectors(normal, moveDir).round(); // ± svetová os

      let axisName, axSign;
      ['x', 'y', 'z'].forEach((a) => {
        if (Math.abs(ax[a]) > 0.5) { axisName = a; axSign = Math.sign(ax[a]); }
      });
      if (!axisName) return null;

      // znamienko tak, aby sa ťahaný bod hýbal v smere moveDir
      const vel = new THREE.Vector3().crossVectors(ax, center);
      const sgn = Math.sign(vel.dot(moveDir)) || 1;

      return {
        axis: axisName,
        layer: Math.round(cubie.position[axisName]),
        angle: axSign * sgn * HALF_PI,
        turns: 1,
      };
    }

    // Klik na stenu kocky pootočí danú vrstvu „smerom od kurzora“ – stačí
    // kliknúť, netreba ťahať. Ťahaním (pohybom myši) sa otáča pohľad kamery.
    window.addEventListener('pointerdown', (e) => {
      if (isBusy || e.target !== renderer.domElement) { drag = null; return; }
      setPointer(e.clientX, e.clientY);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(cubies, false);
      if (hits.length === 0) { drag = null; return; } // prázdny priestor
      const hit = hits[0];
      // svetová normála steny, „prichytená“ na dominantnú os (kvôli zaobleným hranám)
      const wn = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      const ax = Math.abs(wn.x), ay = Math.abs(wn.y), az = Math.abs(wn.z);
      let normal;
      if (ax >= ay && ax >= az) normal = new THREE.Vector3(Math.sign(wn.x), 0, 0);
      else if (ay >= az) normal = new THREE.Vector3(0, Math.sign(wn.y), 0);
      else normal = new THREE.Vector3(0, 0, Math.sign(wn.z));
      drag = { cubie: hit.object, normal, x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
      if (moved < 8) {
        // čistý klik -> otoč vrstvu tak, že klinutý bod ide smerom do stredu (od kurzora)
        const center = toScreen(new THREE.Vector3(0, 0, 0));
        const dx = center.x - drag.x;
        const dy = center.y - drag.y;
        if (Math.hypot(dx, dy) > 1e-3) {
          const move = computeMove(drag.cubie, drag.normal, dx, dy);
          if (move) enqueueMoves([move], 'manual');
        }
      }
      drag = null; // inak to bol ťah -> kameru už otočil OrbitControls
    });

    // Sprístupni pre ladenie z konzoly (kroky plánu 3 a 6).
    window.rubik = {
      applyMove: (t) => enqueue([t], 'manual'),
      isSolved,
      get cubies() { return cubies; },
    };

    // ---------- Štart ----------
    buildCube();
    updateButtons();
    animate();
  </script>
</body>
</html>
